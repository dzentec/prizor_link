<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prizor Cam — Redirecting...</title>
    <meta name="theme-color" content="#131a22">

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kulim+Park:wght@600;700&display=swap" rel="stylesheet">

    <script>
        // Immediate Zero-Delay Smart Router
        const IOS_URL = "https://apps.apple.com/in/app/prizor-cam/id6759190546";
        const ANDROID_URL = "https://play.google.com/store/apps/details?id=com.PRIZORCAM.phone";

        function detectPlatform() {
            const ua = navigator.userAgent || navigator.vendor || window.opera || '';
            
            // iOS detection (iPhone, iPad, iPod)
            if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) {
                return 'ios';
            }
            // iPad on iOS 13+ (reports as MacIntel with touch)
            if (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1) {
                return 'ios';
            }
            // Android detection
            if (/android/i.test(ua)) {
                return 'android';
            }
            return 'other';
        }

        const platform = detectPlatform();

        // Perform instant redirect for mobile devices
        if (platform === 'ios') {
            window.location.replace(IOS_URL);
        } else if (platform === 'android') {
            window.location.replace(ANDROID_URL);
        }
    </script>

    <style>
        :root {
            --bg-dark: #131a22;
            --bg-card: #1a222a;
            --accent-orange: #ff9130;
            --accent-glow: rgba(255, 145, 48, 0.25);
            --text-white: #ffffff;
            --text-muted: #8b949e;
            --border: rgba(255, 255, 255, 0.08);
            --font-heading: 'Kulim Park', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            font-family: var(--font-body);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Ambient Glow Circles (Faseen Style) */
        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        .orb-1 {
            width: 320px;
            height: 320px;
            background: radial-gradient(circle, var(--accent-orange), transparent 70%);
            top: -80px;
            left: -80px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ff6900, transparent 70%);
            bottom: -80px;
            right: -80px;
        }

        /* Minimal Centered Card */
        .redirect-card {
            position: relative;
            z-index: 1;
            background: rgba(26, 34, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 36px 28px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
            animation: cardEntrance 0.4s ease-out;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo */
        .logo-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner-ring {
            position: absolute;
            width: 64px;
            height: 64px;
            border: 2px solid rgba(255, 145, 48, 0.15);
            border-top: 2px solid var(--accent-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .logo-icon {
            width: 38px;
            height: 38px;
        }

        /* App Title & Subtitle */
        .app-name {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .app-name span {
            color: var(--accent-orange);
        }

        .redirect-status {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        /* Fallback Action Buttons */
        .manual-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-store {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: #252d37;
            border: 1px solid var(--border);
            color: var(--text-white);
            text-decoration: none;
            padding: 13px 18px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease;
        }

        .btn-store svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .btn-store:hover {
            border-color: var(--accent-orange);
            background: #2c3642;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 145, 48, 0.2);
        }

        .btn-store.active-os {
            background: var(--accent-orange);
            color: #131a22;
            border-color: var(--accent-orange);
            box-shadow: 0 6px 20px rgba(255, 145, 48, 0.35);
        }

        .btn-store:active {
            transform: scale(0.98);
        }

        /* Footer Info */
        .footer-note {
            margin-top: 20px;
            font-size: 0.72rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="redirect-card">
        <!-- Animated Spinner & Logo -->
        <div class="logo-wrap">
            <div class="spinner-ring"></div>
            <svg class="logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="36" height="36" rx="10" fill="url(#logo_grad)" />
                <path d="M18 9L27 14.2V21.8L18 27L9 21.8V14.2L18 9Z" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
                <circle cx="18" cy="18" r="4" fill="#ffffff" />
                <circle cx="18" cy="18" r="7" stroke="#ff9130" stroke-width="1.5" stroke-dasharray="2 3" />
                <defs>
                    <linearGradient id="logo_grad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                        <stop stop-color="#ff9130"/>
                        <stop offset="1" stop-color="#1f2833"/>
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <h1 class="app-name">PRIZOR<span>.</span>CAM</h1>
        <p class="redirect-status" id="statusText">Redirecting to your app store...</p>

        <!-- Direct Manual Links (for desktop or if pop-up/redirect blocked) -->
        <div class="manual-buttons">
            <a href="https://apps.apple.com/in/app/prizor-cam/id6759190546" class="btn-store" id="iosBtn">
                <svg viewBox="0 0 384 512">
                    <path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/>
                </svg>
                <span>Apple App Store</span>
            </a>

            <a href="https://play.google.com/store/apps/details?id=com.PRIZORCAM.phone" class="btn-store" id="androidBtn">
                <svg viewBox="0 0 512 512">
                    <path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/>
                </svg>
                <span>Google Play Store</span>
            </a>
        </div>

        <p class="footer-note">NVR & DVR Cloud Gateway • Prizor Cam</p>
    </div>

    <script>
        // Update UI state based on platform
        document.addEventListener('DOMContentLoaded', () => {
            const statusEl = document.getElementById('statusText');
            const iosBtn = document.getElementById('iosBtn');
            const androidBtn = document.getElementById('androidBtn');

            if (platform === 'ios') {
                statusEl.textContent = 'Redirecting to Apple App Store...';
                iosBtn.classList.add('active-os');
                // Backup redirect in case header redirect was caught by browser delay
                setTimeout(() => { window.location.href = IOS_URL; }, 150);
            } else if (platform === 'android') {
                statusEl.textContent = 'Redirecting to Google Play Store...';
                androidBtn.classList.add('active-os');
                // Backup redirect in case header redirect was caught by browser delay
                setTimeout(() => { window.location.href = ANDROID_URL; }, 150);
            } else {
                statusEl.textContent = 'Please choose your mobile platform:';
            }
        });
    </script>
</body>
</html>
